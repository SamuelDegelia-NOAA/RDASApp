cost function:
  cost type: 3D-Var
  jb evaluation: false
  time window:
    begin: '2024-05-26T21:00:00Z'
    length: PT6H
    bound to include: begin
  geometry:
    fms initialization:
      namelist filename: fmsmpp.nml
      field table filename: field_table
    namelist filename: input_lam_C775_NP16X10.nml
    akbk: fv3_akbk
    npz: 65
    layout:
    - 16
    - 10
    io_layout:
    - 1
    - 1
    ntiles: 1
  analysis variables:
  - eastward_wind
  - northward_wind
  - air_temperature
  - water_vapor_mixing_ratio_wrt_moist_air
  - ozone_mass_mixing_ratio
  - air_pressure_at_surface
  background:
    datetime: '2024-05-27T00:00:00Z'
    filetype: fms restart
    use_fms_lib: false
    datapath: ./
    filename_core: fv_core.res.tile1.nc
    filename_trcr: fv_tracer.res.tile1.nc
    filename_phys: phy_data_prepdbz.nc
    filename_sfcd: sfc_data.nc
    filename_sfcw: fv_srf_wnd.res.tile1.nc
    filename_cplr: coupler.res
    state variables:
    - eastward_wind
    - northward_wind
    - air_temperature
    - air_pressure_thickness
    - water_vapor_mixing_ratio_wrt_moist_air
    - cloud_liquid_ice
    - cloud_liquid_water
    - ozone_mass_mixing_ratio
    - geopotential_at_surface
    - f10m
    - slmsk
    - sheleg
    - skin_temperature_at_surface
    - vtype
    - stype
    - vfrac
    - tslb
    - smois
    - air_pressure_at_surface
    - rain_water
    - snow_water
    - graupel
    - cloud_droplet_number_concentration
    - cloud_ice_number_concentration
    - rain_number_concentration
    - upward_air_velocity
    - air_temperature_at_2m
    - water_vapor_mixing_ratio_wrt_moist_air_at_2m
    - eastward_wind_at_surface
    - northward_wind_at_surface
    field io names:
      eastward_wind: ua
      northward_wind: va
      air_temperature: T
      air_pressure_thickness: DELP
      air_pressure_at_surface: ps
      water_vapor_mixing_ratio_wrt_moist_air: sphum
      cloud_liquid_ice: ice_wat
      cloud_liquid_water: liq_wat
      ozone_mass_mixing_ratio: o3mr
      geopotential_at_surface: phis
      skin_temperature_at_surface: tsfc
      tslb: tslb
      smois: smois
      rain_water: rainwat
      snow_water: snowwat
      graupel: graupel
      cloud_droplet_number_concentration: water_nc
      cloud_ice_number_concentration: ice_nc
      rain_number_concentration: rain_nc
      upward_air_velocity: W
      equivalent_reflectivity_factor: ref_f3d
      air_temperature_at_2m: t2m
      water_vapor_mixing_ratio_wrt_moist_air_at_2m: q2m
      eastward_wind_at_surface: u_srf
      northward_wind_at_surface: v_srf
  background error:
    covariance model: SABER
    saber central block:
      saber block name: gsi static covariance
      active variables:
      - eastward_wind
      - northward_wind
      - virtual_temperature
      - water_vapor_mixing_ratio_wrt_moist_air
      - mole_fraction_of_ozone_in_air
      - air_pressure_at_surface
      read:
        gsi akbk: fv3_akbk
        gsi error covariance file: berror_stats
        gsi berror namelist file: gsiparm_regional.anl
        processor layout x direction: 16
        processor layout y direction: 10
        debugging deep bypass gsi B error: false
        debugging mode: false
        regional mode: true
    saber outer blocks:
    - saber block name: interpolation
      inner geometry:
        function space: StructuredColumns
        custom grid matching gsi:
          type: rotated_lonlat
          lats: 127
          lons: 211
          lat_start: -14.726005
          lat_end: 14.726005
          lon_start: -25.076254
          lon_end: 25.076254
          north_pole_lat: 51.499999
          north_pole_lon: 82.500018
        custom partitioner matching gsi:
          bands: 10
        halo: 1
      forward interpolator:
        local interpolator type: oops unstructured grid interpolator
      inverse interpolator:
        local interpolator type: oops unstructured grid interpolator
        regional nn fill distance in km: 800
      state variables to inverse:
      - eastward_wind
      - northward_wind
      - air_temperature
      - water_vapor_mixing_ratio_wrt_moist_air
      - ozone_mass_mixing_ratio
      - geopotential_at_surface
      - air_pressure_thickness
      - air_pressure_at_surface
    linear variable change:
      linear variable change name: Control2Analysis
      input variables:
      - eastward_wind
      - northward_wind
      - virtual_temperature
      - water_vapor_mixing_ratio_wrt_moist_air
      - mole_fraction_of_ozone_in_air
      - air_pressure_at_surface
      output variables:
      - eastward_wind
      - northward_wind
      - air_temperature
      - water_vapor_mixing_ratio_wrt_moist_air
      - ozone_mass_mixing_ratio
      - air_pressure_at_surface
  observations:
    obs perturbations: false
    observers:
    - obs space:
        name: aircar_airTemperature_133
        obsdatain:
          engine:
            type: H5File
            obsfile: data/obs/ioda_aircar.nc
            missing file action: warn
          obsgrouping:
            group variables:
            - stationIdentification
            sort variable: pressure
            sort order: descending
        obsdataout:
          empty obs space action: create output
          write multiple files: false
          engine:
            type: H5File
            obsfile: jdiag_aircar_airTemperature_133.nc
            allow overwrite: true
        io pool:
          max pool size: 1
        observed variables:
        - airTemperature
        simulated variables:
        - airTemperature
      obs operator:
        name: VertInterp
        vertical coordinate: air_pressure
        observation vertical coordinate: pressure
        observation vertical coordinate group: MetaData
        interpolation method: log-linear
        variables:
        - name: airTemperature
      linear obs operator:
        name: VertInterp
      obs error:
        covariance model: diagonal
      obs filters:
      - filter: Perform Action
        udescriptor: iuse_check
        filter variables:
        - name: airTemperature
        where:
        - variable: ObsType/airTemperature
          is_in: 133
        action:
          name: accept
      - filter: Perform Action
        udescriptor: obs_type_check
        where:
        - variable: ObsValue/airTemperature
          value: is_not_valid
        action:
          name: reduce obs space
      - filter: Perform Action
        udescriptor: obs_kx_check
        where:
        - variable: ObsType/airTemperature
          is_not_in: 133
        action:
          name: reduce obs space
      - filter: RejectList
        udescriptor: quality_marker_check
        filter variables:
        - name: airTemperature
        where:
        - variable: QualityMarker/airTemperature
          is_in: 4-15
          value: is_not_valid
        where operator: or
        action:
          name: reduce obs space
      - filter: Bounds Check
        udescriptor: time_window_check
        filter variables:
        - name: airTemperature
        test variables:
        - name: MetaData/timeOffset
        minvalue: -2700
        maxvalue: 2700
        where:
        - variable: ObsType/airTemperature
          is_in: 133
        action:
          name: reduce obs space
      - filter: DuplicateThinning
        udescriptor: duplicate_check
        filter variables:
        - name: airTemperature
        analysis_time: '2024-05-27T00:00:00Z'
        analysis_time_tolerance: PT0S
        min_spacing: PT90M
        equidistant_time_selection: after
        variable names:
        - MetaData/longitude
        - MetaData/latitude
        - MetaData/pressure
        tolerance:
        - 1.0e-06
        - 1.0e-06
        - 1.0e-06
        where:
        - variable: ObsType/airTemperature
          is_in: 133
        action:
          name: reduce obs space
      - filter: Bounds Check
        udescriptor: online_domain_check
        filter variables:
        - name: airTemperature
        test variables:
        - name: GeoVaLs/observable_domain_mask
        minvalue: 0.0
        maxvalue: 0.5
      - filter: Perform Action
        udescriptor: initial_error_assignment
        filter variables:
        - name: airTemperature
        where:
        - variable: ObsType/airTemperature
          is_in: 133
        action:
          name: assign error
